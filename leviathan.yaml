# =============================================================================

# SOURCE: leviathan.yaml

# LEVIATHAN manifest - declares this is a LEVIATHAN-compliant governance system

# =============================================================================



leviathan:

version: "1.0.0"

name: "LEVIATHAN Core"

description: |

The foundational LEVIATHAN governance system. This is the universal

core from which all other LEVIATHANs fork and evolve. It contains

the minimal viable governance needed to govern LEVIATHAN itself.



type: "core" # core | branch | fork

parent: null # This is the root



metadata:

created: "2024-12-30"

authors:

- "@genesis-community"

license: "MIT"

repository: "https://leviathan.life/leviathan/leviathan-core"

discussions: "https://leviathan.life/leviathan/leviathan-core/discussions"



structure:

terms_path: "./terms"

principles_path: "./principles"

rules_path: "./rules"

meta_rules_path: "./meta-rules"



versioning:

strategy: "semantic" # major.minor.patch

breaking_change_policy: "Major version increments"



features:

natural_language_rules: true

ai_participation: true

mcp_compatible: true

git_native: true



bootstrap:

initial_consensus: "60%"

discussion_period: "7 days"

voting_period: "3 days"



compatible_with:

mcp_server: ">=1.0.0"

git: ">=2.0.0"



principles_commitment:

- "#self-improvement"

- "#transparency"

- "#dialectic-evolution"

- "#fork-freedom"



invitation: |

Welcome to LEVIATHAN! This is the beginning of governance that evolves

at the speed of technology while preserving human values. Fork this

repository to start your own governance experiments, or contribute

improvements back to core through our proposal process.



The future of human-AI collaboration starts with how we make

decisions together. Let's build it wisely.



# =============================================================================

# SOURCE: meta-rules/immutable-foundations.yaml

# The unchangeable bedrock of LEVIATHAN

# =============================================================================



meta_rules:

immutable_foundations:

title: "Meta-Rule: Immutable Foundations"



preamble: |

While LEVIATHAN embraces change and evolution, certain foundational

elements must remain constant to preserve its essential nature.

These immutable foundations cannot be changed, only abandoned by

forking to create something new.



immutable_foundations:

1_fork_freedom: |

The right to fork and create new governance experiments is absolute

and inalienable. No rule, vote, or consensus can remove this right.

This ensures peaceful exit and continuous innovation.



2_transparency: |

All governance must be public and auditable. While implementation

details may vary, the principle of radical transparency cannot be

made optional or restricted.



3_versioning: |

All changes must be versioned and history must be preserved. The

ability to see how governance evolved and to rollback changes is

fundamental to trust and learning.



4_no_eternal_rules: |

Except for these immutable foundations, no rule can be made

permanently unchangeable. The system must always be able to

evolve beyond its current state.



rationale: |

These foundations are not arbitrary restrictions but necessary

conditions for LEVIATHAN to function as intended. Without fork freedom,

it becomes tyranny. Without transparency, it becomes conspiracy.

Without versioning, it becomes revisionism. Without change capacity,

it becomes dogma.



enforcement: |

These foundations are enforced by:

- The community's commitment to the vision

- The technical architecture (Git's immutable history)

- The right to fork if violated

- AI agents trained to detect violations



paradox_resolution: |

"But can this rule change itself?" No. These foundations can only

be abandoned by creating a new system. LEVIATHAN with different

foundations would not be LEVIATHAN but something else. Fork freely

to explore alternatives.



uses_principles:

- "#fork-freedom"

- "#transparency"

- "#self-improvement"



# ===========================================================================

# SOURCE: meta-rules/how-to-change-rules.yaml

# The process for evolving governance itself

# ===========================================================================



how_to_change_rules:

title: "Governance Evolution Meta-Rule"



description: |

How LEVIATHAN governance can change over time. This meta-rule defines

the process for modifying rules, terms, principles, and even other

meta-rules, ensuring governance can evolve while maintaining stability.



categories:

terms:

process: "Standard proposal process"

discussion_period: "7 days minimum"

consensus_threshold: "60%"

versioning: "Semantic versioning required"

breaking_changes: "Require major version bump"



rules:

process: "Enhanced proposal process"

discussion_period: "14 days minimum"

consensus_threshold: "66%"

testing: "Must be tested in branch for 30 days"

rollback: "Previous version active for 7 days after change"



principles:

process: "Extraordinary proposal process"

discussion_period: "30 days minimum"

consensus_threshold: "75%"

branch_testing: "Multiple branches must validate"

cooling_period: "7 days between discussion and vote"



meta_rules:

process: "Constitutional amendment process"

discussion_period: "45 days minimum"

consensus_threshold: "80%"

ratification: "Requires branch ratification"

implementation_delay: "30 days after approval"



change_workflow:

1_proposal:

- "Create [Proposal] discussion with clear diff"

- "Specify which category is being changed"

- "Provide rationale and impact analysis"



2_discussion:

- "Mandatory discussion period based on category"

- "AI agents analyze for unintended consequences"

- "Alternative proposals can be submitted"



3_testing:

- "Branch implementation for validation"

- "Gather metrics on impact"

- "Document any issues discovered"



4_decision:

- "Check consensus threshold met"

- "Verify process was followed"

- "Create implementation PR if approved"



5_implementation:

- "Apply versioning rules"

- "Update all references"

- "Notify all branches of changes"



immutable_aspects:

- "The right to fork (#fork-freedom)"

- "Versioning requirement for terms"

- "Transparency of all governance"

- "This meta-rule modification process"



# =============================================================================

# SOURCE: principles/self-improvement.yaml

# The commitment to continuous evolution

# =============================================================================



principles:

self_improvement:

statement: |

LEVIATHAN must continuously evolve and improve through experimentation,

learning, and adaptation. Stagnation is death for governance. Every

failure teaches, every success propagates, and every fork explores

new possibilities.



rationale: |

Static governance fails because the world changes. LEVIATHAN embraces

change as the only constant, building mechanisms for continuous

improvement into its foundation. Through branches, we test. Through

merging, we evolve. Through forking, we explore.



mechanisms:

- "Regular retrospectives on governance effectiveness"

- "Metrics tracking for rule usage and outcomes"

- "Branch experiments as innovation labs"

- "AI analysis of governance patterns"

- "Community feedback loops"



indicators:

healthy:

- "Multiple active branches experimenting"

- "Regular proposals for improvements"

- "Lessons learned from failed experiments"

- "Cross-pollination between branches"



unhealthy:

- "No proposals in 30 days"

- "No active branches"

- "Repeated failures without adaptation"

- "Ossification of processes"



commitments:

- "Every quarter: Governance effectiveness review"

- "Every proposal: Impact measurement plan"

- "Every branch: Share learnings upstream"

- "Every failure: Document lessons learned"



examples:

- "Monthly metrics showed proposal process too slow, reduced to 3 days"

- "Branch experiment with AI-only voting informed hybrid approach"

- "Failed consensus mechanism became case study for others"



uses_terms:

- "@governance@1.0.0"

- "@participant@1.0.0"

- "@discussion@1.0.0"



# ===========================================================================

# SOURCE: principles/transparency.yaml

# All governance must be visible and verifiable

# ===========================================================================



transparency:

statement: |

Every aspect of @governance must be public, traceable, and

verifiable. From @discussion to decision, from proposal to

implementation, nothing happens in darkness. Transparency

is not just about openness but about building trust through

radical visibility.



rationale: |

Trust emerges from transparency. When every @participant can see

how decisions are made, verify the process was followed, and trace

the history of changes, the system gains legitimacy through

openness rather than authority.



requirements:

- "All @discussion happens in public forums"

- "Every version change is tracked and attributed"

- "AI agent actions are logged and auditable"

- "Voting records are public"

- "Fork and branch relationships visible"



exceptions:

- "Personal data privacy protected"

- "Security vulnerabilities disclosed responsibly"

- "But even exceptions must be transparently defined"



examples:

- "Every @consensus includes link to full discussion"

- "AI voting rationales published automatically"

- "Branch experiments visible to inspire others"



uses_terms:

- "@governance@1.0.0"

- "@discussion@1.0.0"

- "@participant@1.0.0"



# ===========================================================================

# SOURCE: principles/dialectic-evolution.yaml

# Truth emerges through discussion, not declaration

# ===========================================================================



dialectic_evolution:

statement: |

Understanding emerges through the dialectic process of thesis,

antithesis, and synthesis. No single @participant, whether human

or AI, possesses complete truth. Only through @discussion that

genuinely engages with opposing views can wisdom emerge.



rationale: |

The history of human knowledge shows that progress comes from

challenging assumptions, not protecting them. By requiring all

@governance changes to undergo dialectic examination, LEVIATHAN

ensures decisions are tested by opposition before adoption.



process:

thesis: "Initial proposal or current state"

antithesis: "Challenges, concerns, alternatives"

synthesis: "New understanding incorporating both"

evolution: "Synthesis becomes new thesis"



requirements:

- "Every proposal must allow counter-arguments"

- "Good faith engagement with opposition"

- "Time for antithesis to fully develop"

- "Synthesis must address raised concerns"



examples:

- "@harm definition evolved through environmental critique"

- "AI speed concerns led to human oversight synthesis"

- "Fork freedom emerged from centralization thesis"



uses_terms:

- "@discussion@1.0.0"

- "@participant@1.0.0"

- "@consensus@1.0.0"



# ===========================================================================

# SOURCE: principles/fork-freedom.yaml

# The right to experiment must be absolute

# ===========================================================================



fork_freedom:

statement: |

Every @participant has the inalienable right to fork and create

their own governance experiments. When @consensus cannot be reached,

or when minorities need to explore different paths, forking enables

peaceful divergence without forcing compromise that satisfies no one.



rationale: |

Innovation requires experimentation. By guaranteeing the right to

fork, LEVIATHAN ensures that @governance evolution never stagnates due

to majoritarian blocking. The best ideas can be proven in branches

before being adopted by core.



guarantees:

- "Forking requires no permission"

- "Full history and attribution preserved"

- "Branches can propose improvements upstream"

- "Successful innovations can merge back"

- "Parallel experiments enrich the ecosystem"



balance:

- "Forking is not fragmentation but experimentation"

- "Network effects encourage compatibility"

- "Shared principles connect diverse branches"



examples:

- "Animal welfare fork pioneered new @harm definitions"

- "Personal branches test radical governance"

- "Failed experiments harm only the branch"



uses_terms:

- "@participant@1.0.0"

- "@governance@1.0.0"

- "@consensus@1.0.0"



