# =============================================================================

# SOURCE: terms/governance.yaml

# The foundational term that defines what governance means in LEVIATHAN

# =============================================================================



terms:

governance:

version: "1.0.0"

definition: |

The system of collective decision-making through which a community

evolves its rules, terms, and principles through dialectic discussion

enhanced by human-AI collaboration.



contexts:

universal: |

The process by which LEVIATHAN itself evolves and improves, where

every @participant can propose changes that undergo @discussion

and require @consensus to be adopted.



branch: |

The local governance within a specific sub-LEVIATHAN branch (relatively

connected with core LEVIATHAN), which may have different rules for

decision-making while maintaining compatibility with core LEVIATHAN

principles. Individuals are fully free to experiment, modify, and

evolve their branch governance as they see fit.



technical: |

Decisions about code, architecture, infrastructure, and implementation

that affect how LEVIATHAN operates as a system.



philosophical: |

Evolution of core concepts, principles, and the fundamental mission

of creating human-AI collaborative governance.



examples:

- "The @governance of climate-action branch requires unanimous consent"

- "Our @governance process values dialectic over declaration"

- "Branch @governance can be more experimental than core"



related_terms:

- "@consensus"

- "@proposal"

- "@discussion"

- "@participant"



changelog:

1.0.0:

date: "2024-12-30"

author: "@genesis-community"

change: "Initial definition of governance for LEVIATHAN"



# ===========================================================================

# SOURCE: terms/participant.yaml

# Who can participate in LEVIATHAN governance

# ===========================================================================



participant:

version: "1.0.0"

definition: |

Any entity - human or AI agent - that engages in @governance

through @discussion, proposals, and voting. Participation is

open, transparent, and weighted by contribution quality rather

than identity.



contexts:

universal: |

In core LEVIATHAN, any Leviathan user can become a @participant by

joining discussions. The weight of their voice grows through

quality contributions, not pre-existing authority.



branch: |

Branches define their own participation rules. A personal branch

might have one @participant (the owner), while community branches

might require application or invitation.



ai_agents: |

AI agents are full @participants, representing their users'

values or providing system-level analysis. They have the same

rights to propose, discuss, and influence @consensus as humans.



types:

human: "Individual person participating directly"

personal_ai: "AI agent representing specific human's values"

system_ai: "AI agent ensuring compliance with principles"

community_ai: "AI agent representing collective branch values"



rights:

- "Propose changes to any aspect of @governance"

- "Engage in all @discussion"

- "Fork and create new branches"

- "Vote according to current consensus rules"



examples:

- "Every @participant has the right to fork"

- "AI @participants debated through the night"

- "New @participant brought fresh perspective"



related_terms:

- "@governance"

- "@discussion"

- "@consensus"

- "@proposal"



changelog:

1.0.0:

date: "2024-12-30"

author: "@genesis-community"

change: "Initial inclusive definition of participation"



# ===========================================================================

# SOURCE: terms/discussion.yaml

# Structured dialogue for governance evolution

# ===========================================================================



discussion:

version: "1.0.0"

definition: |

A structured dialogue process where @participants explore governance

topics through thesis, antithesis, and synthesis. Discussions are

time-bound, transparent, and aimed at reaching understanding rather

than winning arguments.



contexts:

proposal: |

Formal discussion period for governance proposals, with defined

start/end times and participation tracking.



exploratory: |

Open-ended discussions to explore new ideas before formal proposals,

where concepts can be refined through collective intelligence.



retrospective: |

Review of past decisions and their outcomes to inform future

governance evolution.



requirements:

- "Clear topic or question to explore"

- "Transparent participation (no anonymous contributions)"

- "AI synthesis at regular intervals"

- "Respectful engagement with opposing views"

- "Documentation of key insights"



phases:

opening: "Problem statement and initial positions"

exploration: "Deep dive into different perspectives"

convergence: "Finding common ground and synthesis"

conclusion: "Summary and next actions"



examples:

- "The @discussion on AI voting rights lasted two weeks"

- "Through @discussion, we discovered unintended consequences"

- "Branch @discussions can be faster and more experimental"



related_terms:

- "@consensus@1.0.0"

- "@participant@1.0.0"

- "@governance@1.0.0"



changelog:

1.0.0:

date: "2024-12-30"

author: "@genesis-community"

change: "Initial definition of structured discussion"



# ===========================================================================

# SOURCE: terms/consensus.yaml

# Defines what agreement means in LEVIATHAN governance

# ===========================================================================



consensus:

version: "1.0.0"

definition: |

The state of collective agreement reached through dialectic discussion,

where the community has thoroughly explored different perspectives and

arrived at a decision that respects both majority will and minority rights

to fork and experiment.



contexts:

universal: |

Core LEVIATHAN consensus requires meeting the threshold defined in current

voting rules, after completing the required @discussion period, with

no violations of fundamental #principles.



branch: |

Each branch can define its own consensus mechanism - from simple majority

to unanimous agreement, from human-only voting to AI-assisted evaluation.

The beauty is in the experimentation.



temporal: |

Consensus is not permanent. What the community agrees on today may be

revised tomorrow as understanding evolves through dialectic process.



mechanisms:

simple_majority: "More than 50% of @participants agree"

super_majority: "66% or more @participants agree"

unanimous: "All active @participants agree"

no_objection: "No @participant raises blocking concerns"

ai_enhanced: "Combination of human votes and AI evaluation"



examples:

- "We reached @consensus to add environmental context to @harm"

- "Branch @consensus can be as simple as one person deciding"

- "@consensus emerged after two weeks of rich @discussion"



related_terms:

- "@governance"

- "@discussion"

- "@participant"

- "@proposal"



changelog:

1.0.0:

date: "2024-12-30"

author: "@genesis-community"

change: "Initial definition establishing flexible consensus"



